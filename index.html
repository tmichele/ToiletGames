<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="ToiletGames — piccola suite di giochi single player da fare in cinque minuti.">
<title>ToiletGames</title>
<!-- La versione sta qui, in un posto solo: a ogni pubblicazione si alza il
     numero e si aggiorna la data. Il foglio di stile e tutti gli script
     vengono caricati con ?v=<numero> in coda, quindi una versione nuova non
     può mai girare con uno script vecchio rimasto nella cache del browser —
     è successo: il gioco nuovo c'era e i suoi comandi no, perché input.js
     era quello di prima. -->
<meta name="versione" content="12" data-data="2026-10-24">
<!-- Classifica globale: accesa, sul progetto Firebase toiletgames-f9ec7
     (Realtime Database in europe-west1). I due valori qui sotto NON sono
     segreti — la chiave web di Firebase sta in chiaro in qualunque app
     Firebase, identifica il progetto e non autorizza niente: a proteggere i
     dati sono le regole del database, in dati/regole-firebase.json. Svuotando
     i due attributi la classifica globale si spegne e restano quelle locali;
     per spegnerla solo nella propria scheda basta aprire la pagina con
     ?classifica=off. Istruzioni: docs/CLASSIFICA_GLOBALE.md -->
<meta name="classifica"
      content="https://toiletgames-f9ec7-default-rtdb.europe-west1.firebasedatabase.app"
      data-chiave="AIzaSyAb0-9iSxRw5pp5l3cm4A-U4Hjcc4TiFqs">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚽</text></svg>">
<link rel="stylesheet" href="assets/css/style.css?v=12">
</head>
<body>

<header class="topbar">
  <button class="topbar__back" id="btn-back" hidden aria-label="Torna all'elenco">←</button>
  <h1 class="topbar__logo"><span aria-hidden="true">🚽</span> <span class="topbar__word">Toilet<span class="accent">Games</span></span></h1>
  <span class="topbar__version" id="app-version"></span>
  <div class="topbar__actions">
    <button class="icon-btn" id="btn-board" title="Classifica" aria-label="Classifica del gioco" hidden>🏆</button>
    <button class="icon-btn" id="btn-help" title="Istruzioni" aria-label="Come si gioca" hidden>❓</button>
    <button class="icon-btn" id="btn-sound" title="Audio" aria-label="Attiva o disattiva l'audio">🔊</button>
    <button class="icon-btn" id="btn-profile" title="Giocatore" aria-label="Cambia nome giocatore">👤</button>
  </div>
</header>

<main id="view-home" class="view">
  <p class="intro">Scegli un gioco. Si parte dal livello 1 e si fa più cattiva man mano che avanzi — ma il livello più alto che raggiungi resta segnato 🚩 e dalla partita dopo puoi ripartire da lì.</p>
  <div class="grid" id="game-grid"></div>
  <section class="panel" id="home-stats"></section>
</main>

<main id="view-game" class="view" hidden>
  <div class="hud">
    <div class="hud__item"><span class="hud__label">Livello</span><span class="hud__value" id="hud-level">1</span></div>
    <div class="hud__item"><span class="hud__label" id="hud-score-label">Punti</span><span class="hud__value" id="hud-score">0</span></div>
    <div class="hud__item"><span class="hud__label">Record</span><span class="hud__value" id="hud-best">0</span></div>
    <div class="hud__spacer"></div>
    <button class="icon-btn" id="btn-pause" aria-label="Pausa">⏸</button>
  </div>

  <div class="stage" id="stage">
    <canvas id="canvas" aria-label="Area di gioco" role="img"></canvas>
    <div class="overlay" id="overlay" hidden>
      <div class="overlay__card">
        <h2 class="overlay__title" id="overlay-title"></h2>
        <p class="overlay__body" id="overlay-body"></p>
        <div class="overlay__actions" id="overlay-actions"></div>
      </div>
    </div>
  </div>

  <div class="touch-controls" id="touch-controls" hidden></div>
</main>

<!-- Classifica e istruzioni non stanno più sotto al campo: si aprono dalle
     icone in alto a destra, così lo schermo resta tutto per il gioco. -->
<div class="modal" id="modal" hidden>
  <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__head">
      <h2 id="modal-title">Classifica</h2>
      <button class="icon-btn" id="modal-close" aria-label="Chiudi">✕</button>
    </div>
    <div class="modal__body">
      <section id="modal-board">
        <h3 class="board__tit" id="board-tit-globale">🌍 Globale</h3>
        <p class="board__stato" id="board-stato"></p>
        <ol class="board" id="board-globale"></ol>
        <h3 class="board__tit" id="board-tit-locale">📱 Su questo browser</h3>
        <ol class="board" id="board"></ol>
        <button class="link-btn" id="btn-clear-board">Azzera la classifica locale</button>
      </section>
      <!-- Il nome si «prende»: in classifica globale non possono esserci due
           giocatori con lo stesso nome, e nessuno deve poter firmare col nome
           di un altro. Chi dice sì lo tiene su questo browser. -->
      <section id="modal-nome" hidden>
        <p class="hint" id="nome-intro"></p>
        <form id="form-nome" class="form-nome" autocomplete="off">
          <input id="input-nome" class="form-nome__input" type="text" maxlength="14"
                 placeholder="il tuo nome" aria-label="Nome giocatore"
                 autocapitalize="off" autocorrect="off" spellcheck="false">
          <button class="btn" id="btn-nome-ok" type="submit">Prendi questo nome</button>
        </form>
        <p class="board__stato" id="nome-stato" role="status"></p>
        <!-- Via d'uscita: se prendere il nome non riesce per colpa del server
             (rete giù, progetto configurato male) si deve poter giocare lo
             stesso. La classifica globale è un extra, non una condizione per
             giocare: senza questo pulsante un errore lassù renderebbe la suite
             inutilizzabile quaggiù. -->
        <button class="link-btn" id="btn-nome-salta" hidden>Gioca senza classifica globale</button>
      </section>
      <section id="modal-help" hidden>
        <p class="hint" id="game-howto"></p>
      </section>
    </div>
  </div>
</div>

<script>
/* Gli script si caricano con la versione in coda (?v=N), letta dal <meta>
   qui sopra: è quello che impedisce al browser di mescolare una pagina nuova
   con script vecchi in cache. document.write qui è voluto — inserisce i tag
   mentre la pagina viene analizzata, in ordine e in modo bloccante, esattamente
   come se fossero scritti a mano — e resta l'unico modo di farlo senza un
   passaggio di build. I giochi: aggiungere qui una voce per ogni nuovo gioco,
   prima di core/app, che legge il registro già popolato. */
(function () {
  var v = document.querySelector('meta[name="versione"]').getAttribute('content');
  [
    'core/version', 'core/util', 'core/storage', 'core/sfx', 'core/profile',
    'core/nuvola', 'core/scores', 'core/registry', 'core/input', 'core/engine', 'core/ui',
    'games/serpente', 'games/pong', 'games/memoria', 'games/mattoni', 'games/hockey',
    'games/talpe', 'games/forza4', 'games/tessere', 'games/labirinto', 'games/orda',
    'mappe/codiverno', 'games/pizze', 'games/gregge',
    'core/app'
  ].forEach(function (f) {
    document.write('<script src="assets/js/' + f + '.js?v=' + v + '"><\/script>');
  });
})();
</script>
</body>
</html>
